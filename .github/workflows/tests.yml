name: Run Tests

on:
  push:
    branches: ["main"]
  # Every PR, whatever it targets. Filtering on ["main"] meant a PR stacked
  # on another PR's branch never ran the suite at all - it still reported
  # all checks green, because the only ones that ran were the title
  # validator and the review bot.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    strategy:
      matrix:
        elixir: ["1.18", "1.19"]
        otp: ["27", "28"]
        exclude:
          - elixir: "1.18"
            otp: "28"

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arcana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      # apt-get blocks rather than fails when it loses the dpkg lock race
      # against the runner's unattended-upgrades, and it does not time out on
      # its own. On the 3.0.0 release commit two of three jobs sat on this step
      # for 30 minutes while the third passed, so a wedged runner looks exactly
      # like a slow build. Bound each call, retry, and skip apt entirely when
      # the image already has both tools.
      - name: Install cmake (for hnswlib) and poppler (for PDF tests)
        timeout-minutes: 6
        run: |
          if command -v cmake >/dev/null && command -v pdftotext >/dev/null; then
            echo "cmake and poppler-utils already present, nothing to install"
            exit 0
          fi

          # Two attempts at 60s + 90s plus one 10s sleep is 310s worst case,
          # inside the 6 minute step timeout above - so the error below always
          # gets to print. Three attempts would not fit, and the runner killing
          # the step swallows the diagnostic.
          for attempt in 1 2; do
            status=0
            timeout 60 sudo apt-get update &&
              timeout 90 sudo apt-get install -y --no-install-recommends cmake poppler-utils ||
              status=$?

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            # 124 is timeout(1) killing a stalled call; anything else is apt
            # itself refusing, which needs reading rather than retrying.
            if [ "$status" -eq 124 ]; then
              echo "::warning::apt attempt $attempt stalled and was killed, retrying"
            else
              echo "::warning::apt attempt $attempt failed with status $status, retrying"
            fi

            sleep 10
          done

          echo "::error::could not install cmake and poppler-utils. A stall is usually the Ubuntu mirror; the apt output above says which."
          exit 1
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ matrix.otp }}-${{ matrix.elixir }}-
            ${{ runner.os }}-build-
      - name: Restore Bumblebee model cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/bumblebee
          key: ${{ runner.os }}-bumblebee-all-MiniLM-L6-v2
      - name: Restore EXLA cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/xla
          key: ${{ runner.os }}-exla-${{ matrix.otp }}-${{ matrix.elixir }}
      - name: Install dependencies
        run: mix deps.get
      - name: Check formatting
        run: mix format --check-formatted
      # Catches unused variables, orphaned requires and the like in lib/. Not
      # `mix test --warnings-as-errors`: the LiveView test helpers emit dozens
      # of runtime warnings, which would drown this signal rather than add to
      # it.
      - name: Compile without warnings
        env:
          MIX_ENV: test
        run: mix compile --force --warnings-as-errors
      - name: Run Credo
        run: mix credo --strict
      - name: Create database
        env:
          MIX_ENV: test
          POSTGRES_PORT: "5432"
        run: mix ecto.create -r Arcana.TestRepo
      - name: Run migrations
        env:
          MIX_ENV: test
          POSTGRES_PORT: "5432"
        run: mix ecto.migrate -r Arcana.TestRepo
      - name: Run tests
        env:
          MIX_ENV: test
          POSTGRES_PORT: "5432"
        # :pdf_support is excluded by default in test_helper.exs because it
        # needs pdftotext; poppler-utils is installed above, so run it here.
        # The remaining excluded tags need model downloads or network.
        run: mix test --include pdf_support
